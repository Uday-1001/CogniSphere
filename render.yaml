services:
  - type: web
    name: cognisphere
    env: python
    buildCommand: "pip install torch torchvision --extra-index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
